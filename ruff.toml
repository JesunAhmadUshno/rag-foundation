# Lint scope for this repo (Actions polish pack, 2026-11-04).
# E: pycodestyle errors, F: pyflakes, I: import order.
# Level folders and tests load sibling modules by path: each file inserts
# its folder into sys.path before importing, so those imports carry
# "# noqa: E402" markers, which are live under this selection.
# Line length is 120. Long pre-existing data lines in the level runners
# were wrapped to meet the cap with no change to any string value.
line-length = 120
[lint]
select = ["E", "F", "I"]
