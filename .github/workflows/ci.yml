name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: Unit and layout tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Learn question run
        run: python src/run_rag.py
      - name: Build ablation run
        run: python src/run_build.py
      - name: Deep evaluation run
        run: python src/run_deep.py
      - name: Results regenerate unchanged from the code and question sets
        run: git diff --exit-code results/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uncertainty and leakage checks behind the headline
        run: |
          node site/src/stats.check.mjs
          python site/export.py
          node site/src/rag.check.mjs
